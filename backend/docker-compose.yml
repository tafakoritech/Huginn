services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huginn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huginn}
      POSTGRES_DB: ${POSTGRES_DB:-huginn}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huginn} -d ${POSTGRES_DB:-huginn}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - huginn-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - huginn-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-huginn}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-huginn}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - huginn-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-huginn}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-huginnsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - huginn-net

  tika:
    image: apache/tika:latest
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9998 && printf \"GET /version HTTP/1.0\\r\\n\\r\\n\" >&3 && head -c 200 <&3 | grep -qi \"200 OK\"'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks:
      - huginn-net

  # Development LLM mock. Enables the full ingestion pipeline (and the local
  # worker monitor that probes mock-llm:9991) without internet access. NOT for
  # production — point LLM_BASE_URL at a real provider there.
  mock-llm:
    image: python:3-alpine
    working_dir: /srv
    volumes:
      - ./docker/mock-llm:/srv:ro
    command: ["python", "/srv/server.py"]
    # Internal only on the compose network; does not publish to the host.
    expose:
      - "9991"
    restart: unless-stopped
    networks:
      - huginn-net

  huginn-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    entrypoint: ["/app/huginn-api"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-huginn}:${RABBITMQ_PASSWORD:-huginn}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      TIKA_BASE_URL: http://tika:9998
      HTTP_PORT: "8080"
      # LLM (message generation) uses the same dedicated SOCKS5 transport as
      # the worker; see the huginn-worker notes on LLM_SOCKS5_PROXY.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      # deepseek-v4-flash rejects response_format json_schema (HTTP 400).
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-json_object}
      LLM_SOCKS5_PROXY: ${LLM_SOCKS5_PROXY:-host.docker.internal:10808}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY_MS: ${LLM_RETRY_BASE_DELAY_MS:-500}
      CALL_SCENARIO_OP_TIMEOUT_SECONDS: ${CALL_SCENARIO_OP_TIMEOUT_SECONDS:-185}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - huginn-net

  huginn-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime

    entrypoint: ["/app/huginn-worker"]

    env_file:
      - .env

    environment:
      # -------------------------------------------------------------------------
      # Internal services
      # -------------------------------------------------------------------------
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379

      RABBITMQ_URL: >-
        amqp://${RABBITMQ_USER:-huginn}:${RABBITMQ_PASSWORD:-huginn}@rabbitmq:5672/

      MINIO_ENDPOINT: minio:9000
      TIKA_BASE_URL: http://tika:9998

      WORKER_NAME: worker-1

      # -------------------------------------------------------------------------
      # Real LLM provider
      # -------------------------------------------------------------------------
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}

      # deepseek-v4-flash rejects response_format json_schema (HTTP 400).
      LLM_STRUCTURED_OUTPUT_MODE: ${LLM_STRUCTURED_OUTPUT_MODE:-json_object}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_DELAY_MS: ${LLM_RETRY_BASE_DELAY_MS:-500}

      # -------------------------------------------------------------------------
      # Dedicated SOCKS5 proxy for OUTBOUND LLM traffic ONLY.
      #
      # This is applied explicitly to the LLM HTTP transport (golang.org/x/net/
      # proxy) inside the Go client. It is NOT read from HTTP_PROXY/HTTPS_PROXY/
      # ALL_PROXY — those generic variables must stay unset so internal Docker
      # traffic (postgres/redis/rabbitmq/minio/tika) never routes through Xray.
      #
      # 127.0.0.1 inside this container is the container itself, so the host
      # Xray listener is reached via host.docker.internal (see extra_hosts).
      # Xray must listen on an address reachable from the Docker bridge, not
      # only on the host loopback.
      # -------------------------------------------------------------------------
      LLM_SOCKS5_PROXY: ${LLM_SOCKS5_PROXY:-host.docker.internal:10808}

    # Make the Linux Docker host reachable by this hostname.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      minio:
        condition: service_healthy

      tika:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - huginn-net

  # Optional observability: start with `docker compose --profile observability up -d`
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - huginn-net

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - huginn-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  huginn-net:
    driver: bridge
